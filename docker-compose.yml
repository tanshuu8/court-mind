version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: courtmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-courtmind_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-courtmind_password}
      POSTGRES_DB: ${POSTGRES_DB:-courtmind_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - courtmind_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-courtmind_user} -d ${POSTGRES_DB:-courtmind_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  courtmind_pgdata:
    driver: local
